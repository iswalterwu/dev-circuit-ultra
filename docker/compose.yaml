# Strong isolation reference:
#   dev     -> project only; no ledger mount, no ledger credentials
#   ledger  -> project read-only + ledger read-write; the human records and checks here
#
# Set LEDGER_DIR to the private ledger repo created by `devcircuit ledger init`,
# and PROJECT_NAME to the project's directory name under entries/ in the ledger.
# The ledger must be OUTSIDE the project directory.

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: dev
    working_dir: /work
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ..:/work
      - dev-home:/home/dev
    environment:
      HOME: /home/dev
    command: sleep infinity

  ledger:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: ledger
    working_dir: /work
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ..:/work:ro
      - ${LEDGER_DIR:?Set LEDGER_DIR to the private ledger repo}:/ledger
      - ledger-home:/home/ledger
    environment:
      HOME: /home/ledger
      DEVCIRCUIT_LEDGER: /ledger
      DEVCIRCUIT_PROJECT: ${PROJECT_NAME:?Set PROJECT_NAME to the project name used in the ledger}
    command: sleep infinity

volumes:
  dev-home:
  ledger-home:
