[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "devcircuit"
version = "0.5.0"
description = "Document hygiene and requirement-ID checks for spec-driven repositories, plus ledger-boundary hooks for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iswalterwu" }]
keywords = ["spec-driven-development", "coding-agents", "documentation", "lint", "agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.scripts]
devcircuit = "devcircuit.cli:main"

[project.urls]
Homepage = "https://github.com/iswalterwu/dev-circuit-ultra"
Source = "https://github.com/iswalterwu/dev-circuit-ultra"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo", "**/.pytest_cache"]

[tool.hatch.build.targets.wheel]
packages = ["tools/devcircuit"]

# The skill tree and the hooks are the payload: `devcircuit init` scaffolds from
# skills/*/templates, `sync` copies the three skills, `hooks install` copies the
# hooks. One source of truth in git, one in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "devcircuit/assets/skills"
"hooks" = "devcircuit/assets/hooks"

[tool.hatch.build.targets.sdist]
include = [
  "tools/devcircuit",
  "skills",
  "hooks",
  "sync.ps1",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]